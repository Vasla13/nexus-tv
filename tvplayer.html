<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <title>NEXUS TV</title>
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
        #yt { width: 100vw; height: 100vh; border: 0; display: block; }
    </style>
</head>
<body>
    <!--
      Lecteur YouTube de secours de la télévision NEXUS RP (school_rp).

      C'est le REPLI, utilisé seulement quand le résolveur sans-pub
      (tv-resolver) n'est pas actif. Il joue via le lecteur YouTube officiel —
      donc AVEC pubs, mais instantané. Le sans-pub, lui, passe par le résolveur
      (voir tv-resolver/), qui contourne cette page.

      Hébergé sur GitHub Pages : origine publique valide → pas d'erreur 153.

      Usage : tvplayer.html?v=<ID>&start=<secondes>
    -->
    <div id="yt"></div>
    <script>
        var params = new URLSearchParams(location.search);
        var videoId = (params.get('v') || '').replace(/[^\w-]/g, '');
        var start = parseInt(params.get('start') || '0', 10) || 0;

        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        var player = null;

        function onYouTubeIframeAPIReady() {
            if (!videoId) return;
            player = new YT.Player('yt', {
                videoId: videoId,
                playerVars: {
                    autoplay: 1, controls: 0, rel: 0, fs: 0, disablekb: 1,
                    playsinline: 1, modestbranding: 1, start: start,
                    origin: location.origin
                },
                events: {
                    onReady: function (e) {
                        e.target.mute();
                        e.target.playVideo();
                        setTimeout(function () { e.target.unMute(); e.target.setVolume(90); }, 400);
                    },
                    onStateChange: function (e) {
                        if (e.data === YT.PlayerState.ENDED) e.target.playVideo();
                    }
                }
            });
        }

        // Son spatial : le jeu envoie le volume (0..1) selon la distance.
        window.addEventListener('message', function (ev) {
            var d = ev.data || {};
            if (d.type === 'volume' && player && player.setVolume) {
                var x = Math.max(0, Math.min(1, +d.value || 0));
                if (x <= 0) { player.mute(); }
                else { player.unMute(); player.setVolume(Math.round(x * 100)); }
            }
        });
    </script>
</body>
</html>
